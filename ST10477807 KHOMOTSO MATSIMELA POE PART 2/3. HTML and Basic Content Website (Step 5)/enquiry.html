         <main> 
            <h2>Make an Enquiry</h2> 
             
            <p> 
                Have a question or would like to order one of our products?Complete the form below and we will get back to you. 
            </p>
             
             <form> 
                <label for="name">Full name:</label><br>
             <input type="text" id="name" name="name" required><br><br> 

              <label for="email"> Email Address:</label><br> 
              <input type="email" id="email" name="email" required><br><br>
         
             <label for="phone">Phone Number:</label><br> 
             <input type="tel" id="phone" name="phone"><br><br> 
 
             <label for="product">Product:</label><br> 
             <select id="product" name="product"> 
             <option value="cake">Birthday Cake</option> 
             <option value="cupcakes">Cupcakes</option> 
             <option value="bread">Fresh Bread</option> 
             <option value="muffins">Muffins</option> 
             <option value="bisuits">Biscuits</option> 
             </select> 

              <label for="message">Your Enquiry:</label><br> 
              <textarea id="message" name="message" rows="6" required></textarea><br><br>
 
              <button type="submit">Submit Enquiry</button> 
             </form> 
         </main>
